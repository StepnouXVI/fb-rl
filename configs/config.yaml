defaults:
  - env: antmaze_medium
  - planner: all
  - _self_

eval:
  checkpoint_dir: "fb-test"
  seeds: [0, 1, 2, 3, 4]
  num_episodes: 15
  eval_temperature: 0.0
  video_episodes: 0
  video_frame_skip: 3
  output_dir: "results"
  n_workers: 4
  device: "auto"

distillation:
  model_type: "dense_eca" # options: "mlp", "dense_eca", "dense_gated_attn", "resnet_eca"
  n_pairs: 2000
  batch_size: 128
  epochs: 20
  lr: 1e-3
  hidden_dim: 256
  n_layers: 3
  num_heads: 4
  device: "auto"
