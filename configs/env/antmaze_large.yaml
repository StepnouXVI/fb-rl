name: "antmaze-large-navigate-v0"
split: "large"
max_episode_steps: 1500
complex_task_name: null

planner:
  n_landmarks: 2000
  lookahead_dist: 2.6
  max_edge_radius: 3.5
  reachability_cutoff: 35.0
  stagnation_threshold: 0.4
  stagnation_patience: 40
  stagnation_temp: 0.25
  recursive_bisection:
    max_depth: 3
    n_candidates: 400
    hit_threshold: 35.0
  single_wp:
    hidden_dim: 384
    n_layers: 4
  enhanced_seq_attn:
    hidden_dim: 384
    num_heads: 6
    n_layers: 4
    window_size: 6
    alibi_slope: 0.4
    dropout_rate: 0.2
